<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f1e8">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
        <span class="brand-mark">G</span>
        <span>{{ site.title }}</span>
      </a>
      <nav aria-label="主导航">
        <a href="{{ '/' | relative_url }}">文章</a>
        <a href="{{ '/about/' | relative_url }}">关于</a>
        <a href="https://github.com/{{ site.author.github }}" rel="me">GitHub ↗</a>
      </nav>
    </header>

    <main>{{ content }}</main>

    <footer class="site-footer">
      <p>© {{ 'now' | date: '%Y' }} {{ site.author.name }} · 写作让思考留下痕迹。</p>
    </footer>
  </body>
</html>
